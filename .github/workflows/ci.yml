name: PHP CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP ${{ matrix.php-version }} checks
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.4']

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, mbstring, mysqli, pdo_mysql, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP syntax
        run: |
          php -l spark
          php -l preload.php
          find app public tests -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Run PHPUnit suite
        run: vendor/bin/phpunit --configuration phpunit.dist.xml --no-coverage

      - name: Audit locked dependencies
        if: matrix.php-version == '8.4'
        run: composer audit --locked
